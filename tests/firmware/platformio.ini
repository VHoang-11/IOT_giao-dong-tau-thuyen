; Test đơn vị lõi C trên máy chủ (PlatformIO native + Unity). Chạy: pio test -e native
; core/src/sim/ (M2) bị loại bởi core/library.json.
[platformio]
test_dir = test

[env:native]
platform = native
test_framework = unity
lib_deps =
  symlink://../../core
  symlink://../../firmware/lib/svmg_msg
  bblanchon/ArduinoJson@^6.21.5
build_flags = -Wall -Wextra -O1 -DUNITY_INCLUDE_DOUBLE=0
