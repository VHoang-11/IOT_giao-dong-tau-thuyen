paths:
  processed_root: ml/data/processed
  feature_root: ml/data/features
  report_root: ml/reports/features
  preprocessing_config: ml/preprocessing/config.yaml

features:
  target_sampling_hz: 10.0
  window_stride_seconds: 10.0
  minimum_valid_fraction: 0.95
  maximum_gap_factor: 1.5
  numeric_zero_epsilon_deg: 1.0e-9
  r_squared_zero_tolerance: 1.0e-15
  quantile_method: type7
  endpoint_convention: "(t-W,t]"
  long_window_segments_seconds: [60.0, 60.0, 60.0]
  period_centering: window_mean
  zero_crossing_interpolation: linear
  period_estimator: median_upward_crossing_interval
  period_minimum_upward_crossings: 3
  period_cv_minimum_periods: 3
  source_gyro_status:
    seafar: UNVERIFIED_SIGNAL_MAPPING
    hohai: MISSING_SOURCE_SIGNAL
    southampton: UNVERIFIED_SIGNAL_MAPPING

stability:
  run: true
  alternative_cutoff_hz: 3.0
  representative_policy: longest_processed_segment_per_dataset

output:
  compression: zstd
  plot_dpi: 120
