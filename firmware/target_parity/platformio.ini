[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
  symlink://lib/svmg_features
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter -I../../core/include
build_unflags = -std=gnu++11
