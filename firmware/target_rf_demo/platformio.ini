; M2-R2: target ESP32 CÔ LẬP chạy RF demo M2-R1 (không phải firmware production); model C nạp qua prepare_model.py.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:prepare_model.py
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11
