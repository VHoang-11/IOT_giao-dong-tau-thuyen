; PlatformIO - firmware ESP32 (M1). Lõi dùng chung nằm ở ../core (C thuần, loại core/src/sim bởi core/library.json).
; Build: pio run     Mô phỏng: xem firmware/README.md (Wokwi extension, wokwi/wokwi.toml)
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; WiFi+MQTT+JSON chiếm ~1.2 MB: dùng phân vùng app lớn (không cần OTA) để chừa chỗ cho model.h của M2
board_build.partitions = huge_app.csv
lib_deps =
  symlink://../core
  bblanchon/ArduinoJson@^6.21.5
; stubs/: mock sim + model (M2 thay thế); ../ml/export: nơi M2 đặt model.h (chưa tồn tại thì -I bị bỏ qua)
build_src_filter = +<*> +<../stubs/sim_stub.cpp>
build_flags =
  -std=gnu++17
  -Wall -Wextra
  -Wno-unused-parameter
  -DCORE_DEBUG_LEVEL=0
  -Iinclude
  -Istubs
  -I../ml/export
build_unflags = -std=gnu++11

; Môi trường chỉ để ĐO chi phí flash của phần phân tích JSON (link sẽ lỗi - chỉ cần file .o): pio run -e probe_noparse
[env:probe_noparse]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSVMG_MSG_NO_PARSE

; Bản có chèn lỗi qua Serial để chạy T05/T07/T13 trên Wokwi khi đang mô phỏng. KHÔNG dùng cho demo/đánh giá chính thức.
[env:esp32dev_inject]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSVMG_FAULT_INJECT
