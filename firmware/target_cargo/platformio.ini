; Cargo Node (Multi-Node, Hướng 2): ESP32 thứ 2 chỉ đo hầm hàng (chiết áp mực nước GPIO 35 + DHT22 GPIO 4) và publish MQTT.
; Độc lập hoàn toàn với Motion Node (firmware/ + core/ + ml/). Không gửi roll/pitch.
; Build: cd firmware/target_cargo && pio run      Mô phỏng: ../wokwi/diagram_cargo.json + ../wokwi/wokwi.cargo.toml
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
  -std=gnu++17
  -Wall -Wextra
  -DCORE_DEBUG_LEVEL=0
  -Iinclude
build_unflags = -std=gnu++11
