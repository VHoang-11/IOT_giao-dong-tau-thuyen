components:
  schemas:
    AckResult:
      properties:
        alarm:
          $ref: '#/components/schemas/AlarmOut'
        already_acked:
          type: boolean
          title: Already Acked
        device_ack:
          type: string
          title: Device Ack
          default: not_applicable
        device_ack_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Ack Detail
        device_ack_cmd_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Ack Cmd Id
      type: object
      required:
      - alarm
      - already_acked
      title: AckResult
    AgreementStats:
      properties:
        device_id:
          type: string
          title: Device Id
        voyage_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Voyage Id
        source_label:
          type: string
          title: Source Label
        source_modes:
          items:
            type: string
          type: array
          title: Source Modes
        status:
          type: string
          enum:
          - OK
          - INSUFFICIENT_DATA
          - MIXED_SOURCES
          title: Status
          default: OK
        samples_considered:
          type: integer
          title: Samples Considered
        excluded_sensor_fault:
          type: integer
          title: Excluded Sensor Fault
        excluded_unclassified:
          type: integer
          title: Excluded Unclassified
          default: 0
        unclassified_labels:
          additionalProperties:
            type: integer
          type: object
          title: Unclassified Labels
          default: {}
        matched:
          type: integer
          title: Matched
        agreement_rate:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Agreement Rate
          description: Chi co khi status = OK; None neu khong co cap hop le hoac tron
            nguon
        by_rf_class:
          additionalProperties:
            $ref: '#/components/schemas/ClassAgreement'
          type: object
          title: By Rf Class
        by_source_mode:
          additionalProperties:
            $ref: '#/components/schemas/ModeAgreement'
          type: object
          title: By Source Mode
          default: {}
        limit:
          type: integer
          title: Limit
        first_sample_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Sample At
        last_sample_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Sample At
        notes:
          items:
            type: string
          type: array
          title: Notes
      type: object
      required:
      - device_id
      - source_label
      - source_modes
      - samples_considered
      - excluded_sensor_fault
      - matched
      - by_rf_class
      - limit
      - notes
      title: AgreementStats
      description: 'Ty le Random Forest trung Baseline B. Day la do NHAT QUAN giua
        hai mo hinh, KHONG phai do chinh xac

        (khong co nhan that) va khong phai du bao nguy hiem.'
    AlarmLabel:
      type: string
      enum:
      - TRUE_ALARM
      - FALSE_ALARM
      - UNCLEAR
      title: AlarmLabel
      description: 'Danh gia sau su viec (G4): canh bao do dung / sai / chua ro. Chi
        phuc vu danh gia, KHONG anh huong vong doi.'
    AlarmLabelRequest:
      properties:
        label:
          $ref: '#/components/schemas/AlarmLabel'
      additionalProperties: false
      type: object
      required:
      - label
      title: AlarmLabelRequest
    AlarmLevel:
      type: string
      enum:
      - NORMAL
      - CAUTION
      - WARNING
      - CRITICAL
      title: AlarmLevel
    AlarmOut:
