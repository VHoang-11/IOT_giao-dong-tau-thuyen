          type: string
          pattern: ^[A-Za-z0-9_.-]{1,64}$
          title: Voyage Id
      - name: from_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Giờ server (ISO 8601; thiếu múi giờ thì coi là UTC)
          title: From Time
        description: Giờ server (ISO 8601; thiếu múi giờ thì coi là UTC)
      - name: to_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Time
      - name: from_t_sim
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Theo t_sim_s của thiết bị
          title: From T Sim
        description: Theo t_sim_s của thiết bị
      - name: to_t_sim
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: To T Sim
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          description: Số mẫu telemetry mỗi trang
          default: 1000
          title: Limit
        description: Số mẫu telemetry mỗi trang
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          description: next_cursor của trang trước
          title: Cursor
        description: next_cursor của trang trước
      responses:
