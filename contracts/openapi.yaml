openapi: 3.1.0
info:
  title: SVMG Backend
  description: Smart Vessel Motion Guard - nguyên mẫu nghiên cứu/đào tạo, dữ liệu
    mô phỏng. Không phải hệ thống an toàn hàng hải.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/devices:
    get:
      tags:
      - devices
      summary: List Devices
      operationId: list_devices_api_v1_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeviceOut'
                type: array
                title: Response List Devices Api V1 Devices Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/devices/{device_id}:
    get:
      tags:
      - devices
      summary: Get Device
      operationId: get_device_api_v1_devices__device_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/telemetry:
    get:
      tags:
      - devices
      summary: Get Telemetry
      operationId: get_telemetry_api_v1_devices__device_id__telemetry_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryOut'
                title: Response Get Telemetry Api V1 Devices  Device Id  Telemetry
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Dang nhap (form: username, password) -> JWT. Dung duoc voi nut
        Authorize cua /docs.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/change-password:
    post:
      tags:
      - auth
      summary: Change Password
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users:
    get:
      tags:
      - auth
      summary: List Users
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - auth
      summary: Create User
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users/{user_id}:
    patch:
      tags:
      - auth
      summary: Update User
      operationId: update_user_api_v1_users__user_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms:
    get:
      tags:
      - alarms
      summary: List Alarms
      operationId: list_alarms_api_v1_alarms_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlarmState'
          - type: 'null'
          title: State
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlarmOut'
                title: Response List Alarms Api V1 Alarms Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms/stats:
    get:
      tags:
      - alarms
      summary: Alarm Stats
      operationId: alarm_stats_api_v1_alarms_stats_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmStats'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms/{alarm_pk}:
    get:
      tags:
      - alarms
      summary: Get Alarm
      operationId: get_alarm_api_v1_alarms__alarm_pk__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: alarm_pk
        in: path
        required: true
        schema:
          type: integer
          title: Alarm Pk
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms/{alarm_pk}/ack:
    post:
      tags:
      - alarms
      summary: Ack Alarm
      description: ACK ghi nhan nguoi truc da biet. KHONG tat canh bao cuc bo tren
        thiet bi.
      operationId: ack_alarm_api_v1_alarms__alarm_pk__ack_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: alarm_pk
        in: path
        required: true
        schema:
          type: integer
          title: Alarm Pk
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/commands:
    post:
      tags:
      - commands
      summary: Send Command
      description: Gui lenh. Vai tro toi thieu tuy lenh (service.REQUIRED_ROLE). Gui
        lai cung cmd_id -> 200, khong gui lan hai.
      operationId: send_command_api_v1_devices__device_id__commands_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/commands:
    get:
      tags:
      - commands
      summary: List Commands
      operationId: list_commands_api_v1_commands_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CommandState'
          - type: 'null'
          title: State
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandOut'
                title: Response List Commands Api V1 Commands Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/commands/stats:
    get:
      tags:
      - commands
      summary: Command Stats
      operationId: command_stats_api_v1_commands_stats_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStats'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/commands/{cmd_id}:
    get:
      tags:
      - commands
      summary: Get Command
      operationId: get_command_api_v1_commands__cmd_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: cmd_id
        in: path
        required: true
        schema:
          type: string
          title: Cmd Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/config:
    get:
      tags:
      - commands
      summary: Config History
      description: Lich su cau hinh, moi nhat truoc.
      operationId: config_history_api_v1_devices__device_id__config_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigOut'
                title: Response Config History Api V1 Devices  Device Id  Config Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - commands
      summary: Update Config
      operationId: update_config_api_v1_devices__device_id__config_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/config/rollback:
    post:
      tags:
      - commands
      summary: Rollback Config
      description: Rollback = tao phien ban MOI co noi dung cua ban cu (thiet bi chi
        nhan version lon hon).
      operationId: rollback_config_api_v1_devices__device_id__config_rollback_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit:
    get:
      tags:
      - commands
      summary: List Audit
      operationId: list_audit_api_v1_audit_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: actor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditOut'
                title: Response List Audit Api V1 Audit Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health/devices:
    get:
      tags:
      - health
      summary: Fleet Health
      description: 'Tong quan suc khoe moi thiet bi: ban health moi nhat + co ''stale''.'
      operationId: fleet_health_api_v1_health_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeviceHealthSummary'
                type: array
                title: Response Fleet Health Api V1 Health Devices Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/devices/{device_id}/health:
    get:
      tags:
      - health
      summary: Device Health History
      operationId: device_health_history_api_v1_devices__device_id__health_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceHealthOut'
                title: Response Device Health History Api V1 Devices  Device Id  Health
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/notify/status:
    get:
      tags:
      - notify
      summary: Notify Status
      description: Kenh nao da cau hinh + bo dem gui/loi. KHONG tra ve token/URL.
      operationId: notify_status_api_v1_notify_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyStatus'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/notify/test:
    post:
      tags:
      - notify
      summary: Notify Test
      description: Gui 1 tin thu toi moi kenh da cau hinh (dong bo) de kiem tra token/webhook.
      operationId: notify_test_api_v1_notify_test_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
      security:
      - OAuth2PasswordBearer: []
components:
  schemas:
    AckResult:
      properties:
        alarm:
          $ref: '#/components/schemas/AlarmOut'
        already_acked:
          type: boolean
          title: Already Acked
      type: object
      required:
      - alarm
      - already_acked
      title: AckResult
    AlarmLevel:
      type: string
      enum:
      - NORMAL
      - CAUTION
      - WARNING
      - CRITICAL
      title: AlarmLevel
    AlarmOut:
      properties:
        id:
          type: integer
          title: Id
        alarm_id:
          type: string
          title: Alarm Id
        device_id:
          type: string
          title: Device Id
        boot_id:
          type: string
          title: Boot Id
        voyage_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Voyage Id
        state:
          $ref: '#/components/schemas/AlarmState'
        level:
          $ref: '#/components/schemas/AlarmLevel'
        max_level:
          $ref: '#/components/schemas/AlarmLevel'
        motion_class:
          anyOf:
          - $ref: '#/components/schemas/MotionClass'
          - type: 'null'
        source_mode:
          $ref: '#/components/schemas/SourceMode'
        opened_at:
          type: string
          format: date-time
          title: Opened At
        acked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Acked At
        acked_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Acked By
        cleared_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cleared At
        escalated:
          type: boolean
          title: Escalated
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        time_to_ack_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Time To Ack S
          readOnly: true
      type: object
      required:
      - id
      - alarm_id
      - device_id
      - boot_id
      - state
      - level
      - max_level
      - source_mode
      - opened_at
      - escalated
      - time_to_ack_s
      title: AlarmOut
    AlarmState:
      type: string
      enum:
      - ACTIVE
      - ACKED
      - CLEARED
      title: AlarmState
    AlarmStats:
      properties:
        total:
          type: integer
          title: Total
        active:
          type: integer
          title: Active
        acked:
          type: integer
          title: Acked
        cleared:
          type: integer
          title: Cleared
        escalated:
          type: integer
          title: Escalated
        mtta_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Mtta S
        escalation_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Escalation Rate
        by_max_level:
          additionalProperties:
            type: integer
          type: object
          title: By Max Level
      type: object
      required:
      - total
      - active
      - acked
      - cleared
      - escalated
      - by_max_level
      title: AlarmStats
    AuditOut:
      properties:
        id:
          type: integer
          title: Id
        ts:
          type: string
          format: date-time
          title: Ts
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        target:
          anyOf:
          - type: string
          - type: 'null'
          title: Target
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Detail
      type: object
      required:
      - id
      - ts
      - actor
      - action
      title: AuditOut
    Body_login_api_v1_auth_login_post:
      properties:
        grant_type:
          anyOf:
          - type: string
            pattern: ^password$
          - type: 'null'
          title: Grant Type
        username:
          type: string
          title: Username
        password:
          type: string
          format: password
          title: Password
        scope:
          type: string
          title: Scope
          default: ''
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
      type: object
      required:
      - username
      - password
      title: Body_login_api_v1_auth_login_post
    ChannelStatus:
      properties:
        name:
          type: string
          title: Name
        configured:
          type: boolean
          title: Configured
      type: object
      required:
      - name
      - configured
      title: ChannelStatus
    CommandName:
      type: string
      enum:
      - set_profile
      - set_threshold
      - calibrate_zero
      - mute_alarm
      - start_voyage
      - stop_voyage
      - restart_device
      title: CommandName
    CommandOut:
      properties:
        cmd_id:
          type: string
          title: Cmd Id
        device_id:
          type: string
          title: Device Id
        cmd:
          type: string
          title: Cmd
        params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Params
        ttl_s:
          type: integer
          title: Ttl S
        issued_by:
          type: string
