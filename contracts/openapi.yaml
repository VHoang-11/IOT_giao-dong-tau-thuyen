  /api/v1/monitor/agreement:
    get:
      tags:
      - monitor
      summary: Monitor Agreement
      description: 'Tỉ lệ Random Forest trùng Baseline B. Đây là độ **nhất quán**
        giữa hai mô hình, không phải độ chính xác

        (không có nhãn thật) và không phải dự báo nguy hiểm. Chỉ tính cặp mà **cả
        hai** mô hình có lớp phân loại hợp lệ;

        UNKNOWN/FAULT bị loại và đếm riêng (UNKNOWN == UNKNOWN không phải đồng thuận).
        Mẫu `sensor_ok=false` bị loại.

        `agreement_rate = null` khi không có cặp hợp lệ (`status=INSUFFICIENT_DATA`)
        hoặc trộn SENSOR/SIMULATION

        (`status=MIXED_SOURCES`, xem `by_source_mode`) — không phải 0%.'
      operationId: monitor_agreement_api_v1_monitor_agreement_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_.-]+$
          description: Mã thiết bị (bắt buộc)
          title: Device Id
        description: Mã thiết bị (bắt buộc)
      - name: voyage_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9_.-]+$
          - type: 'null'
          description: Giới hạn theo một chuyến; bỏ trống = toàn bộ thiết bị
          title: Voyage Id
        description: Giới hạn theo một chuyến; bỏ trống = toàn bộ thiết bị
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Lấy tối đa N cặp hợp lệ gần nhất (cả RF và Baseline có lớp
            phân loại)
          default: 1000
          title: Limit
        description: Lấy tối đa N cặp hợp lệ gần nhất (cả RF và Baseline có lớp phân
          loại)
      - name: source_mode
