      - replay
      summary: Replay Voyage
      description: 'Dữ liệu để phát lại một chuyến. Tốc độ ×1–×60 do giao diện tự
        xử lý.


        Sắp xếp theo (server_rx_time, id). Chọn MỘT trục lọc: from_time/to_time hoặc
        from_t_sim/to_t_sim.

        `truncated=true` nghĩa là còn trang sau: gọi lại với `cursor=next_cursor`
        (giữ nguyên các tham số lọc).'
      operationId: replay_voyage_api_v1_voyages__voyage_id__replay_get
