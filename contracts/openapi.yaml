openapi: 3.1.0
info:
  title: SVMG Backend
  description: Smart Vessel Motion Guard - nguyên mẫu nghiên cứu/đào tạo, dữ liệu
    mô phỏng. Không phải hệ thống an toàn hàng hải.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/devices:
    get:
      tags:
      - devices
      summary: List Devices
      operationId: list_devices_api_v1_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeviceOut'
                type: array
                title: Response List Devices Api V1 Devices Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - devices
      summary: Register Device
      description: Đăng ký thiết bị trước khi nó gửi bản tin đầu tiên (Admin). Bắt
        buộc nêu rõ SENSOR hay SIMULATION.
      operationId: register_device_api_v1_devices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/devices/{device_id}:
    get:
      tags:
      - devices
      summary: Get Device
      operationId: get_device_api_v1_devices__device_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - devices
      summary: Update Device
      description: 'Đặt tên / bật-tắt thiết bị (Admin). Tắt (`enabled=false`): bản
        tin bị từ chối, không nhận lệnh, cấu hình,

        chuyến mới. KHÔNG xóa thiết bị để giữ lịch sử và báo cáo.'
      operationId: update_device_api_v1_devices__device_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/cargo:
    get:
      tags:
      - devices
      summary: Get Cargo
      description: 'Du lieu ham hang (moi nhat truoc). `device_id` la tau chinh (gop
        moi Cargo Node gan vao no theo

        `parent_device_id`) hoac chinh Cargo Node. Gia tri khong doc duoc la null
        (khong phai 0).'
      operationId: get_cargo_api_v1_devices__device_id__cargo_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CargoOut'
                title: Response Get Cargo Api V1 Devices  Device Id  Cargo Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/telemetry:
    get:
      tags:
      - devices
      summary: Get Telemetry
      operationId: get_telemetry_api_v1_devices__device_id__telemetry_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryOut'
                title: Response Get Telemetry Api V1 Devices  Device Id  Telemetry
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/cargo/status:
    get:
      tags:
      - cargo
      summary: Cargo Status
      description: Trạng thái chính thức từng chỉ số (nước mm, nhiệt độ, độ ẩm). Thiếu/cũ/lỗi
        dữ liệu ⇒ UNKNOWN kèm lý do, không bao giờ NORMAL.
      operationId: cargo_status_api_v1_devices__device_id__cargo_status_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoStatusOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/cargo/alerts:
    get:
      tags:
      - cargo
      summary: Cargo Alerts
      operationId: cargo_alerts_api_v1_devices__device_id__cargo_alerts_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlarmState'
          - type: 'null'
          title: State
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CargoAlertOut'
                title: Response Cargo Alerts Api V1 Devices  Device Id  Cargo Alerts
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cargo/alerts/{alert_id}/ack:
    post:
      tags:
      - cargo
      summary: Ack Cargo Alert
      description: 'ACK ghi nhận người trực đã biết (OPERATOR trở lên). Không đồng
        nghĩa với giải tỏa: chỉ CLEARED khi chỉ số trở về NORMAL.'
      operationId: ack_cargo_alert_api_v1_cargo_alerts__alert_id__ack_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: integer
          title: Alert Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoAlertOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/cargo/config:
    get:
      tags:
      - cargo
      summary: Get Cargo Config
      description: Cấu hình hầm hàng + ngưỡng hiệu lực (kèm nguồn tham chiếu, đơn
        vị, phiên bản) và các trường còn thiếu.
      operationId: get_cargo_config_api_v1_devices__device_id__cargo_config_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoConfigOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - cargo
      summary: Put Cargo Config
      description: Đặt chiều sâu hầm, thang đo cảm biến nước, loại tàu/hàng, trạng
        thái hiệu chuẩn và (tuỳ chọn) ghi đè ngưỡng. SUPERVISOR trở lên.
      operationId: put_cargo_config_api_v1_devices__device_id__cargo_config_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoConfigIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoConfigOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Dang nhap (form: username, password) -> JWT. Dung duoc voi nut
        Authorize cua /docs.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/change-password:
    post:
      tags:
      - auth
      summary: Change Password
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users:
    get:
      tags:
      - auth
      summary: List Users
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - auth
      summary: Create User
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users/{user_id}:
    patch:
      tags:
      - auth
      summary: Update User
      operationId: update_user_api_v1_users__user_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms:
    get:
      tags:
      - alarms
      summary: List Alarms
      description: Loc theo thiet bi, trang thai, nhan danh gia. `unlabeled=true`
        -> chi cac canh bao chua duoc danh gia.
      operationId: list_alarms_api_v1_alarms_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlarmState'
          - type: 'null'
          title: State
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AlarmLabel'
          - type: 'null'
          title: Label
      - name: unlabeled
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unlabeled
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlarmOut'
                title: Response List Alarms Api V1 Alarms Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms/stats:
    get:
      tags:
      - alarms
      summary: Alarm Stats
      operationId: alarm_stats_api_v1_alarms_stats_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmStats'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms/{alarm_pk}:
    get:
      tags:
      - alarms
      summary: Get Alarm
      operationId: get_alarm_api_v1_alarms__alarm_pk__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: alarm_pk
        in: path
        required: true
        schema:
          type: integer
          title: Alarm Pk
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms/{alarm_pk}/ack:
    post:
      tags:
      - alarms
      summary: Ack Alarm
      description: ACK ghi nhan nguoi truc da biet. KHONG tat canh bao cuc bo tren
        thiet bi.
      operationId: ack_alarm_api_v1_alarms__alarm_pk__ack_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: alarm_pk
        in: path
        required: true
        schema:
          type: integer
          title: Alarm Pk
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alarms/{alarm_pk}/label:
    put:
      tags:
      - alarms
      summary: Label Alarm
      description: 'Danh gia sau su viec: TRUE_ALARM / FALSE_ALARM / UNCLEAR (chi
        SUPERVISOR tro len).

        Nhan KHONG anh huong vong doi canh bao (khong ACK, khong tat, khong chan leo
        thang).'
      operationId: label_alarm_api_v1_alarms__alarm_pk__label_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: alarm_pk
        in: path
        required: true
        schema:
          type: integer
          title: Alarm Pk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmLabelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/commands:
    post:
      tags:
      - commands
      summary: Send Command
      description: Gui lenh. Vai tro toi thieu tuy lenh (service.REQUIRED_ROLE). Gui
        lai cung cmd_id -> 200, khong gui lan hai.
      operationId: send_command_api_v1_devices__device_id__commands_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/commands:
    get:
      tags:
      - commands
      summary: List Commands
      operationId: list_commands_api_v1_commands_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CommandState'
          - type: 'null'
          title: State
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandOut'
                title: Response List Commands Api V1 Commands Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/commands/stats:
    get:
      tags:
      - commands
      summary: Command Stats
      operationId: command_stats_api_v1_commands_stats_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStats'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/commands/{cmd_id}:
    get:
      tags:
      - commands
      summary: Get Command
      operationId: get_command_api_v1_commands__cmd_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: cmd_id
        in: path
        required: true
        schema:
          type: string
          title: Cmd Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/config:
    get:
      tags:
      - commands
      summary: Config History
      description: Lich su cau hinh, moi nhat truoc.
      operationId: config_history_api_v1_devices__device_id__config_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigOut'
                title: Response Config History Api V1 Devices  Device Id  Config Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - commands
      summary: Update Config
      operationId: update_config_api_v1_devices__device_id__config_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/config/rollback:
    post:
      tags:
      - commands
